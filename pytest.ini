[pytest]
# pytest-html 2.0.1 imports pkg_resources, which setuptools 82 removed, and
# seleniumbase's plugin then reads pytest-html's --html option. Neither is used
# by these pure-function tests, so both are disabled rather than pinning
# setuptools back. The breakage is fleet-wide (amzn-catalog-health hits it too).
addopts = -p no:html -p no:seleniumbase
testpaths = tests
